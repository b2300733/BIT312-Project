<header class="sticky top-0 z-50 border-b border-gray-300 bg-white/90 backdrop-blur">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 lg:px-8">
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2 text-[#205b9b]">
        <lucide-icon [img]="Heart" class="h-5 w-5"></lucide-icon>
        <span class="text-lg font-extrabold tracking-tight">Service Day</span>
      </div>
      @if (authService.currentUser()?.role === 'admin') {
        <span class="rounded-full bg-orange-200 px-2.5 py-0.5 text-xs font-semibold">Admin</span>
      }
    </div>

    <div class="flex items-center gap-2 text-sm">
      <div class="z-10 hidden text-right sm:block">
        <p class="font-medium text-gray-900">{{ authService.currentUser()?.name }}</p>
        <p class="text-xs text-gray-500">{{ authService.currentUser()?.department }}</p>
      </div>

      <button
        type="button"
        class="z-10 inline-flex h-9 cursor-pointer items-center justify-center gap-2 rounded-md px-3 text-gray-600 transition-colors hover:bg-gray-100"
        (click)="signOut()"
      >
        <lucide-icon [img]="LogOut" class="h-4 w-4"></lucide-icon>
        <span class="hidden sm:inline">Sign Out</span>
      </button>
    </div>
  </div>
</header>
