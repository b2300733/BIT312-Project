<app-header></app-header>

<div class="mx-auto max-w-7xl px-4 py-6 lg:px-8">
  <div class="mb-6">
    <h1 class="text-2xl font-extrabold tracking-tight">Admin Dashboard</h1>
    <p class="text-sm text-gray-500">Manage NGO activities and monitor employee participation</p>
  </div>

  <div class="grid grid-cols-2 gap-4 lg:grid-cols-4">
    <mat-card class="flex-row! items-center gap-4 bg-white! p-4">
      <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-[#27619b1a]">
        <lucide-icon [img]="Building2" class="text-primary h-5 w-5"></lucide-icon>
      </div>
      <div>
        <p class="text-2xl font-extrabold">{{ stats().totalActivities }}</p>
        <p class="text-xs text-gray-500">Total Activities</p>
      </div>
    </mat-card>

    <mat-card class="flex-row! items-center gap-4 bg-white! p-4">
      <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-[#6a8caf1a]">
        <lucide-icon [img]="Users" class="h-5 w-5 text-[#6a8caf]"></lucide-icon>
      </div>
      <div>
        <p class="text-2xl font-extrabold">{{ stats().totalSlots }}</p>
        <p class="text-xs text-gray-500">Total Slots</p>
      </div>
    </mat-card>

    <mat-card class="flex-row! items-center gap-4 bg-white! p-4">
      <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-[#36a17d1a]">
        <lucide-icon [img]="UserCheck" class="text-green h-5 w-5"></lucide-icon>
      </div>
      <div>
        <p class="text-2xl font-extrabold">{{ stats().totalRegistered }}</p>
        <p class="text-xs text-gray-500">Registered</p>
      </div>
    </mat-card>

    <mat-card class="flex-row! items-center gap-4 bg-white! p-4">
      <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-[#f0f2f4]">
        <lucide-icon [img]="UserX" class="h-5 w-5 text-[#67737e]"></lucide-icon>
      </div>
      <div>
        <p class="text-2xl font-extrabold">{{ stats().totalAvailable }}</p>
        <p class="text-xs text-gray-500">Slots Available</p>
      </div>
    </mat-card>
  </div>

  <app-admin-navbar></app-admin-navbar>

  <div class="mt-6">
    <router-outlet></router-outlet>
  </div>
</div>
