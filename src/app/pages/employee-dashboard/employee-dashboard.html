<app-header></app-header>
<div class="mx-auto max-w-7xl px-4 py-6 lg:px-8">
  <div class="mb-6">
    <h1 class="text-2xl font-extrabold tracking-tight">Service Day Dashboard</h1>
    <p class="text-sm text-gray-500">Browse and register for volunteer activities</p>
  </div>

  <div class="grid grid-cols-2 gap-4 lg:grid-cols-4">
    <mat-card class="flex-row! items-center gap-4 bg-white! p-4">
      <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-[#27619b1a]">
        <lucide-icon [img]="Heart" class="text-primary h-5 w-5"></lucide-icon>
      </div>
      <div>
        <p class="text-2xl font-extrabold">{{ totalActivities }}</p>
        <p class="text-xs text-gray-500">Activities</p>
      </div>
    </mat-card>

    <mat-card class="flex-row! items-center gap-4 bg-white! p-4">
      <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-[#36a17d1a]">
        <lucide-icon [img]="CalendarCheck" class="text-green h-5 w-5"></lucide-icon>
      </div>
      <div>
        <p class="text-2xl font-extrabold">{{ registeredCount }}</p>
        <p class="text-xs text-gray-500">Registered</p>
      </div>
    </mat-card>

    <mat-card class="flex-row! items-center gap-4 bg-white! p-4">
      <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-[#f0f2f4]">
        <lucide-icon [img]="Search" class="h-5 w-5 text-[#67737e]"></lucide-icon>
      </div>
      <div>
        <p class="text-2xl font-extrabold">{{ availableCount }}</p>
        <p class="text-xs text-gray-500">Available</p>
      </div>
    </mat-card>
  </div>

  <app-employee-navbar></app-employee-navbar>

  <div class="mt-6">
    <router-outlet></router-outlet>
  </div>
</div>
